name: flowlens

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowlens}
      POSTGRES_USER: ${POSTGRES_USER:-flowlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowlens}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: flowlens-postgres-data
