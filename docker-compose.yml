name: flowlens

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowlens}
      POSTGRES_USER: ${POSTGRES_USER:-flowlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowlens}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      FLOWLENS_SERVICE_NAME: ${FLOWLENS_SERVICE_NAME:-flowlens-api}
      FLOWLENS_APP_ENVIRONMENT: ${FLOWLENS_APP_ENVIRONMENT:-development}
      FLOWLENS_LOG_LEVEL: ${FLOWLENS_LOG_LEVEL:-INFO}
      FLOWLENS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowlens}:${POSTGRES_PASSWORD:-flowlens}@postgres:5432/${POSTGRES_DB:-flowlens}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      FLOWLENS_SERVICE_NAME: ${FLOWLENS_SERVICE_NAME:-flowlens-api}
      FLOWLENS_APP_ENVIRONMENT: ${FLOWLENS_APP_ENVIRONMENT:-development}
      FLOWLENS_LOG_LEVEL: ${FLOWLENS_LOG_LEVEL:-INFO}
      FLOWLENS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowlens}:${POSTGRES_PASSWORD:-flowlens}@postgres:5432/${POSTGRES_DB:-flowlens}

volumes:
  postgres_data:
    name: flowlens-postgres-data
