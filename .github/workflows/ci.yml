name: CI

on:
  push:
    branches:
      - main
      - feat/w01-project-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  classify-change:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      change_class: ${{ steps.classify.outputs.class }}
      gate: ${{ steps.classify.outputs.gate }}

    steps:
      - name: Check out exact source head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify verified current delta
        id: classify
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python scripts/ci/classify_change.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --expected-head "$EXPECTED_HEAD" \
            --output-json "$RUNNER_TEMP/change-class.json" \
            --github-output "$GITHUB_OUTPUT"

  quality:
    name: Quality gate
    needs: classify-change
    if: ${{ always() && !cancelled() && (needs['classify-change'].result != 'success' || needs['classify-change'].outputs.change_class != 'P') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: flowlens_test
          POSTGRES_USER: flowlens_ci
          POSTGRES_PASSWORD: flowlens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlens_ci -d flowlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: flowlens_test
      POSTGRES_USER: flowlens_ci
      POSTGRES_PASSWORD: flowlens_ci
      FLOWLENS_SERVICE_NAME: flowlens-api
      FLOWLENS_APP_ENVIRONMENT: test
      FLOWLENS_LOG_LEVEL: INFO
      FLOWLENS_DATABASE_URL: postgresql+psycopg://flowlens_ci:flowlens_ci@127.0.0.1:5432/flowlens_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Configure Week 2 temporary artifact directory
        shell: bash
        run: echo "C06_OUTPUT_DIR=$RUNNER_TEMP/flowlens-ci-artifacts" >> "$GITHUB_ENV"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked dependencies
        run: uv sync --frozen

      - name: Verify PostgreSQL readiness
        run: >-
          uv run python -c "from flowlens.config import get_settings;
          from flowlens.db import check_database_connectivity, create_database_engine;
          engine = create_database_engine(get_settings());
          assert check_database_connectivity(engine); engine.dispose()"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Create isolated Week 2 smoke database
        id: c06-database
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          assert not Path("data/hidden_ground_truth/scenario_manifest.yaml").exists()
          assert not Path(os.environ["C06_OUTPUT_DIR"]).exists()
          with psycopg.connect(
              host="127.0.0.1", port=5432, dbname="postgres",
              user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE flowlens_ci_profile_test")
          PY

      - name: Migrate isolated Week 2 smoke database
        env:
          FLOWLENS_DATABASE_URL: postgresql+psycopg://flowlens_ci:flowlens_ci@127.0.0.1:5432/flowlens_ci_profile_test
        run: uv run alembic upgrade head

      - name: Generate and persist Week 2 CI profile
        env:
          FLOWLENS_DATABASE_URL: postgresql+psycopg://flowlens_ci:flowlens_ci@127.0.0.1:5432/flowlens_ci_profile_test
        run: >-
          uv run python -m flowlens.data.cli generate
          --profile ci --seed 20260824 --period-start 2026-01-01
          --generator-version 0.1.0-c03 --output-dir "$C06_OUTPUT_DIR"

      - name: Validate Week 2 CI profile
        env:
          FLOWLENS_DATABASE_URL: postgresql+psycopg://flowlens_ci:flowlens_ci@127.0.0.1:5432/flowlens_ci_profile_test
        run: uv run python -m flowlens.data.cli validate --output-dir "$C06_OUTPUT_DIR"

      - name: Verify public artifacts and HGT isolation
        env:
          FLOWLENS_DATABASE_URL: postgresql+psycopg://flowlens_ci:flowlens_ci@127.0.0.1:5432/flowlens_ci_profile_test
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from flowlens.config import get_settings
          from flowlens.data.artifacts import public_manifest, quality_markdown, quality_report
          from flowlens.data.persistence import read_active_dataset
          from flowlens.data.quality import validate_dataset
          from flowlens.db import create_database_engine

          directory = Path(os.environ["C06_OUTPUT_DIR"])
          names = {"dataset_manifest.json", "data_quality_report.json", "data_quality_report.md"}
          assert {path.name for path in directory.iterdir()} == names
          assert all((directory / name).is_file() for name in names)
          assert not Path("data/hidden_ground_truth/scenario_manifest.yaml").exists()
          engine = create_database_engine(get_settings())
          try:
              dataset = read_active_dataset(engine)
          finally:
              engine.dispose()
          result = validate_dataset(dataset)
          assert result.passed
          manifest = public_manifest(dataset)
          assert manifest["profile"] == "ci" and manifest["seed"] == 20260824
          assert manifest["period_start"] == "2026-01-01"
          assert manifest["period_end"] == "2026-06-30"
          assert manifest["generator_version"] == "0.1.0-c03"
          assert manifest["row_counts_by_table"]["fact_sales_order"] == 800
          assert json.loads((directory / "dataset_manifest.json").read_text()) == manifest
          assert json.loads((directory / "data_quality_report.json").read_text()) == quality_report(dataset, result)
          assert (directory / "data_quality_report.md").read_text() == quality_markdown(dataset, result)
          forbidden = (
              "scenario_id", "scenario_name", "scenario_type", "scn_", "true_root_cause",
              "root_cause", "target_entity_ids", "affected_entities", "causal_chain",
              "hgt_id", "hgt_hash",
          )
          for name in names:
              content = (directory / name).read_text().lower()
              assert not any(token in content for token in forbidden), name
          print("CI profile: 800 orders / six months; public artifacts PASS; HGT leakage NONE")
          PY

      - name: Run database integration tests
        run: uv run pytest -m integration

      - name: Run complete test suite
        run: uv run pytest -m "not integration"

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Verify dependency lock
        run: uv lock --check

      - name: Clean up isolated Week 2 smoke database
        if: always() && steps.c06-database.outcome == 'success'
        run: |
          uv run python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              host="127.0.0.1", port=5432, dbname="postgres",
              user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
              autocommit=True,
          ) as connection:
              connection.execute("DROP DATABASE flowlens_ci_profile_test")
          PY

      - name: Clean up temporary Week 2 public artifacts
        if: always() && steps.c06-database.outcome == 'success'
        run: |
          uv run python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          directory = Path(os.environ["C06_OUTPUT_DIR"])
          expected = Path(os.environ["RUNNER_TEMP"]).resolve() / "flowlens-ci-artifacts"
          assert not directory.is_symlink() and directory.resolve() == expected
          if directory.exists():
              shutil.rmtree(directory)
          assert not Path("data/hidden_ground_truth/scenario_manifest.yaml").exists()
          PY

  w03-ai-loop-gate:
    name: W03 AI loop gate
    # Order semantic proof after the existing proof jobs; always() keeps failures visible.
    needs: [classify-change, quality, compose-smoke, publication-proof]
    if: ${{ always() && !cancelled() && (needs['classify-change'].result != 'success' || needs['classify-change'].outputs.change_class != 'P') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: flowlens_test
          POSTGRES_USER: flowlens_ci
          POSTGRES_PASSWORD: flowlens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlens_ci -d flowlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: flowlens_test
      POSTGRES_USER: flowlens_ci
      POSTGRES_PASSWORD: flowlens_ci
      FLOWLENS_SERVICE_NAME: flowlens-api
      FLOWLENS_APP_ENVIRONMENT: test
      FLOWLENS_LOG_LEVEL: INFO
      FLOWLENS_DATABASE_URL: postgresql+psycopg://flowlens_ci:flowlens_ci@127.0.0.1:5432/flowlens_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked dependencies
        run: uv sync --frozen

      - name: Verify PostgreSQL readiness
        run: >-
          uv run python -c "from flowlens.config import get_settings;
          from flowlens.db import check_database_connectivity, create_database_engine;
          engine = create_database_engine(get_settings());
          assert check_database_connectivity(engine); engine.dispose()"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run frozen W03 semantic regression gate
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run python scripts/ci/run_w03_ai_loop_gate.py \
            --manifest docs/w03/checkpoints/c09/specs/c09_gate_manifest.json \
            --expected-head "$EXPECTED_HEAD" \
            --output-json "$RUNNER_TEMP/w03-ai-loop-gate.json"

  compose-smoke:
    name: Docker Compose smoke
    needs: classify-change
    if: ${{ always() && !cancelled() && (needs['classify-change'].result != 'success' || needs['classify-change'].outputs.change_class != 'P') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_DB: flowlens_smoke_test
      POSTGRES_USER: flowlens_smoke
      POSTGRES_PASSWORD: flowlens_smoke
      POSTGRES_PORT: 5432
      API_PORT: 8000
      FLOWLENS_SERVICE_NAME: flowlens-api
      FLOWLENS_APP_ENVIRONMENT: test
      FLOWLENS_LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull --no-cache api worker

      - name: Start Docker Compose stack
        run: docker compose up -d postgres api worker

      - name: Wait for PostgreSQL readiness
        shell: bash
        run: |
          for attempt in {1..45}; do
            container_id="$(docker compose ps -q postgres)"
            if [[ -n "$container_id" ]]; then
              health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
              if [[ "$health" == "healthy" ]]; then
                echo "PostgreSQL is healthy"
                exit 0
              fi
            fi
            sleep 2
          done

          echo "PostgreSQL did not become healthy within 90 seconds" >&2
          exit 1

      - name: Verify API health contract
        shell: bash
        run: |
          for attempt in {1..45}; do
            if response="$(curl --fail --silent http://127.0.0.1:8000/health)"; then
              jq -e '
                . == {
                  "status": "ok",
                  "service": "flowlens-api",
                  "database": "ok"
                }
              ' <<< "$response"
              exit 0
            fi
            sleep 2
          done

          echo "API health endpoint did not become ready within 90 seconds" >&2
          exit 1

      - name: Verify Worker remains running
        shell: bash
        run: |
          worker_id="$(docker compose ps -q worker)"
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Running}}' "$worker_id")" = "true"

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color postgres api worker

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  publication-proof:
    name: Publication proof
    needs: classify-change
    if: ${{ needs['classify-change'].result == 'success' && needs['classify-change'].outputs.change_class == 'P' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact source head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify publication-only exact source delta
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python scripts/ci/verify_publication.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --expected-head "$EXPECTED_HEAD"

  verification-gate:
    name: Verification gate
    needs: [classify-change, quality, compose-smoke, publication-proof, w03-ai-loop-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce class-specific exact-SHA proof
        env:
          CHANGE_CLASS: ${{ needs['classify-change'].outputs.change_class }}
          CLASS_RESULT: ${{ needs['classify-change'].result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPOSE_RESULT: ${{ needs['compose-smoke'].result }}
          W03_RESULT: ${{ needs['w03-ai-loop-gate'].result }}
          PUBLICATION_RESULT: ${{ needs['publication-proof'].result }}
        run: |
          test "$CLASS_RESULT" = success
          if [[ "$CHANGE_CLASS" == P ]]; then
            test "$PUBLICATION_RESULT" = success
            test "$QUALITY_RESULT" = skipped
            test "$COMPOSE_RESULT" = skipped
            test "$W03_RESULT" = skipped
          else
            test "$CHANGE_CLASS" = C -o "$CHANGE_CLASS" = I -o "$CHANGE_CLASS" = F -o "$CHANGE_CLASS" = UNKNOWN
            test "$QUALITY_RESULT" = success
            test "$COMPOSE_RESULT" = success
            test "$W03_RESULT" = success
            test "$PUBLICATION_RESULT" = skipped
          fi
